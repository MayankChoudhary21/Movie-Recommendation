<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recommendation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body class="bg-blue-500">  

    <!-- Header Section -->
    <header class="text-gray-600 body-font -my-8">
      <div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center">
        <a class="flex title-font font-medium items-center text-gray-900 mb-4 md:mb-0">
          <img src="static/thumbnail.jpg" alt="Logo" class="w-10 h-10 rounded-full">
          <span class="ml-3 text-xl">Movie Recommender System</span>
        </a>
        <nav class="md:ml-auto flex flex-wrap items-center text-base justify-center">
          <a href="/" class="mr-5 hover:text-gray-900">Home</a>
          <a href="/about" class="mr-5 hover:text-gray-900">About</a>
          <a href="/contact" class="mr-5 hover:text-gray-900">Contact Us</a>
          <a href="/recommendation" class="mr-5 hover:text-gray-900">Recommendation</a>
        </nav>
      </div>
    </header>
    
    <hr>

    <!-- Movie Selection Section -->
    <section class="text-gray-600 body-font">
      <div class="container px-5 py-24 mx-auto">
        <div class="flex flex-col text-center w-full mb-12">
          <h1 class="sm:text-3xl text-2xl font-medium title-font mb-4 text-gray-900">Your Movie Recommender!!</h1>
          <p class="text-primary"><b>{{ error }}</b></p>
        </div>
        
        <!-- Movie Selection Form -->
        <form action="/recommendation" method="POST" class="flex lg:w-2/3 w-full sm:flex-row flex-col mx-auto px-8 sm:space-x-4 sm:space-y-0 space-y-4 sm:px-0 items-end">
          <div class="relative flex-grow w-full">
            <label for="movies" class="leading-7 text-sm text-gray-900">Movie Name</label>
            <select id="movies" name="movies" class="form-select">
              {% for j in movies_list %}
                <option value="{{ j }}" {% if j == selected_movie %} selected {% endif %}>{{ j }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="text-white bg-green-500 border-0 py-2 px-8 focus:outline-none hover:bg-green-600 rounded text-lg">Get Recommendations</button>
        </form>

      </div>
    </section>

    <!-- Recommended Movies Section -->
    {% if status == True %}
    <section class="text-gray-600 body-font">
      <div class="container px-5 py-24 mx-auto">
        
        <!-- Section Title -->
        <div class="flex flex-wrap w-full mb-20">
          <div class="lg:w-1/2 w-full mb-6 lg:mb-0">
            <h1 class="sm:text-3xl text-2xl font-medium title-font mb-2 text-gray-900">Recommended Movies</h1>
            <div class="h-1 w-20 bg-indigo-500 rounded"></div>
          </div>
        </div>

        <!-- Movie Posters Grid -->
        <div class="flex flex-wrap -m-4">
          {% for poster in poster %}
          <div class="xl:w-1/4 md:w-1/2 p-3">
            <div class="bg-gray-100 p-6 rounded-lg h-full flex flex-col">
              <img class="rounded w-full object-cover object-center aspect-[16/9]" src="{{ poster }}" alt="Movie Poster">
              <h3 class="tracking-widest text-indigo-500 text-xs font-medium title-font mt-2">SUBTITLE</h3>
              <h2 class="text-lg text-gray-900 font-medium title-font mb-4">{{ movies_name[loop.index0] }}</h2>
            </div>
          </div>
          {% endfor %}
        </div>

      </div>
    </section>
    {% endif %}

    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  </body>
</html>
